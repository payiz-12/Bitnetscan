name: Build check

# Builds the site (type check included) and checks the syntax of the serverless functions and of
# the scripts the scheduled jobs run, which no deployment builds: a mistake there would stop the
# hourly dataset without any visible error. A failing run is marked on the commit and emailed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        run: npm run build
      - name: Check the functions and scripts
        run: for f in api/*.js api/_lib/*.js scripts/*.mjs; do node --check "$f"; done
